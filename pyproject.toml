[project]
name = "query-taxonomy"
version = "0.1.0"
description = "Feature extractors over queries and documents for corpus profiling and Strategy Router dataset work."
authors = [
    {name = "andrei.cristea", email = "andrei.cristea@qdrant.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "edify (>=0.3.0,<0.4.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "spacy (>=3.8.14,<4.0.0)",
    "spacy[apple] (>=3.8.14,<4.0.0) ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "click (>=8.0,<9.0)"
]

[tool.poetry]
packages = [
    {include = "query_taxonomy", from = "src"}
]
include = [
    {path = "src/query_taxonomy/query-taxonomy.csv", format = ["sdist", "wheel"]}
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.20,<0.16.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)"
]
