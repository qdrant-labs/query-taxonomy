<!doctype html>
<meta charset="utf-8">
<title>Query Taxonomy · live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F19; --card: #111824; --card2: #141A2A;
    --line: #232a3d; --line-strong: #4E5366;
    --fg: #F0F3FA; --dim: #656B7F;
    --red: #DC244C;
    --structured_identifiers: #6047FF;
    --sentence_markers: #009688;
    --logical_structures: #03A9F4;
    --corruption: #FF9800;
    --semantical: #DC244C;
    --sans: "Mona Sans", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "Geist Mono", "JetBrains Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 40px 24px 64px; }
  header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 24px; }
  h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.5px; margin: 0; }
  header p { margin: 0; color: var(--dim); font-size: 14px; }
  header .mode { margin-left: auto; font: 400 12px/1 var(--mono); color: var(--dim); }
  header .warn { color: var(--corruption); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 328px; gap: 24px; align-items: start; }
  @media (max-width: 1040px) { .grid { grid-template-columns: minmax(0, 1fr); } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 24px; }
  .card + .card { margin-top: 24px; }
  h2 {
    font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--dim); margin: 0 0 16px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    font: 400 12px/1 var(--sans); color: var(--fg); background: var(--card2);
    border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  .chip:hover { border-color: var(--red); color: var(--red); }

  textarea {
    width: 100%; min-height: 84px; resize: vertical; background: var(--card2);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 16px;
    color: var(--fg); font: 400 16px/1.6 var(--mono); outline: none;
  }
  textarea:focus { border-color: var(--red); }

  #out {
    margin-top: 32px; font: 400 19px/3.4 var(--mono); white-space: pre-wrap;
    word-break: break-word; min-height: 160px;
  }
  #out .seg { position: relative; }
  #out .lbl {
    position: absolute; left: 0; font: 500 10px/1 var(--sans); letter-spacing: 0.6px;
    white-space: nowrap; background: var(--card); padding: 2px 3px; border-radius: 3px;
  }
  .empty { color: var(--dim); font: 400 14px/1.6 var(--sans); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .legend span { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
  .legend i { width: 14px; height: 2px; border-radius: 2px; }

  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 0 4px; }
  .row b { font: 400 13px/1 var(--mono); color: var(--fg); font-weight: 400; }
  .row span { font: 500 13px/1 var(--mono); color: var(--fg); }
  .bar { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--secondary, #6047FF); }
  .tally { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
  .tally i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tally em { font-style: normal; color: var(--dim); margin-left: auto; font-family: var(--mono); }
  .lang { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; }
  .lang b { font: 500 16px/1 var(--mono); }
  .lang span { font-size: 12px; color: var(--dim); }
</style>

<div class="wrap">
  <header>
    <h1>Query taxonomy</h1>
    <p>every bank, claim-resolved, as you type · no LLM</p>
    <p class="mode"><span id="mode">…</span><span class="warn" id="warn"></span></p>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <div class="chips" id="chips"></div>
        <textarea id="in" spellcheck="false" placeholder="Type a query…"></textarea>
        <div id="out"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Signals</h2>
        <div id="tallies"></div>
      </div>
      <div class="card">
        <h2>Language</h2>
        <div id="langs"></div>
      </div>
      <div class="card">
        <h2>Statistics</h2>
        <div id="stats"></div>
      </div>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
